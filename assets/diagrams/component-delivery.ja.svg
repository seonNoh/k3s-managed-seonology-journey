<text x="32" y="464" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--dim)">linux/amd64 + linux/arm64</text>
<text x="456" y="464" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" fill="var(--dim)">タグ: X.Y.Z · sha-&lt;7&gt; · latest</text>
<text x="32" y="496" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--faint)">コンポーネントタグでは対応するイメージだけを公開します。</text>
<text x="32" y="520" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--faint)">main・手動実行では各最新バージョンタグを使います。CI は別のトリガーで動きます。</text>
