<path data-from="j60-component-delivery-ja-trigger" data-to="j60-component-delivery-ja-api" data-pts="224,152;280,152" d="M224,152 L280,152" class="j60-component-delivery-ja-quiet" marker-end="url(#j60-component-delivery-ja-tq)"/>
<path data-from="j60-component-delivery-ja-api" data-to="j60-component-delivery-ja-back" data-pts="452,192;452,232" d="M452,192 L452,232" class="j60-component-delivery-ja-flow" marker-end="url(#j60-component-delivery-ja-t)"/>
