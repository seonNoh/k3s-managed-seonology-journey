<text x="712" y="144" font-size="15" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="500" fill="var(--text)" data-box="j60-component-delivery-ja-registry">Gitea Registry</text>
<text x="712" y="168" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" fill="var(--body)" data-box="j60-component-delivery-ja-registry">seonology-journey-api</text>
