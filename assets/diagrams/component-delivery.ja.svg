<text x="304" y="288" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" fill="var(--body)" data-box="j60-component-delivery-ja-back">apps/back/Dockerfile</text>
<rect id="j60-component-delivery-ja-web" data-kind="card" x="280" y="352" width="344" height="80" rx="12" fill="url(#j60-component-delivery-ja-s)" stroke="var(--line)" filter="url(#j60-component-delivery-ja-sh)"/>
<path d="M292,353 H612" stroke="var(--hl)" fill="none"/>
<text x="304" y="384" font-size="15" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="500" fill="var(--text)" data-box="j60-component-delivery-ja-web">3 · web</text>
<text x="304" y="408" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" fill="var(--body)" data-box="j60-component-delivery-ja-web">apps/web/Dockerfile</text>
