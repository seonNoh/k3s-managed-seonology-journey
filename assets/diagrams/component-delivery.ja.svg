<text x="52" y="184" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--body)" data-box="j60-component-delivery-ja-trigger">main / 手動実行</text>
<text x="52" y="224" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--body)" data-box="j60-component-delivery-ja-trigger">コンポーネントタグ</text>
<text x="52" y="256" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" fill="var(--body)" data-box="j60-component-delivery-ja-trigger">*-vX.Y.Z</text>
<text x="52" y="280" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" fill="var(--body)" data-box="j60-component-delivery-ja-trigger">workflow_dispatch</text>
