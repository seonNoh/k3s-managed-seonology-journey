<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" lang="en" role="img" aria-labelledby="j60-repository-roles-en-title j60-repository-roles-en-desc">
<title id="j60-repository-roles-en-title">Repository map</title>
<desc id="j60-repository-roles-en-desc">Directory ownership within one monorepo</desc>
<style>
  svg{
    --bg:#0d1117; --surface-a:#1b222c; --surface-b:#151b23;
    --lead-a:#222b38; --lead-b:#19202a;
    --inner:#1e2530; --inner-lead:#232c39;
    --line:#252d38; --line-lead:#33404f;
    --text:#f0f6fc; --body:#c3ccd6; --dim:#a2abb5; --faint:#8d959f;
    --accent:#7c9fff; --accent-bg:rgba(124,159,255,.16);
    --ok:#4ac97e; --warn:#e0a740; --bad:#f2705e; --off:#8b939d;
    --quiet:#78818c;
    --sh:#000; --sh-op:.50; --shl-op:.58; --shs-op:.40;
    --glow-op:.40; --glow-cast:.45; --hl:rgba(255,255,255,.05);
  }
  @media (prefers-color-scheme: light){
    svg{
      --bg:#f6f8fa; --surface-a:#ffffff; --surface-b:#fafbfc;
      --lead-a:#ffffff; --lead-b:#f5f8ff;
      --inner:#eef1f4; --inner-lead:#e9f0fe;
      --line:#d8dee4; --line-lead:#b8c9ee;
      --text:#1f2328; --body:#3d444d; --dim:#59636e; --faint:#656d7a;
      --accent:#2f62d4; --accent-bg:rgba(47,98,212,.10);
      --ok:#187734; --warn:#8e5f00; --bad:#cf222e; --off:#5f6773;
      --quiet:#6e7781;
      --sh:#1f2328; --sh-op:.13; --shl-op:.18; --shs-op:.12;
      --glow-op:.35; --glow-cast:.14; --hl:transparent;
    }
  }
  .j60-repository-roles-en-flow{fill:none;stroke:var(--accent);stroke-width:1.6;
          stroke-linecap:round;stroke-linejoin:round;
          stroke-dasharray:5 6;animation:j60-repository-roles-en-move 2s linear infinite}
  .j60-repository-roles-en-quiet{fill:none;stroke:var(--quiet);stroke-width:1.4;
           stroke-linecap:round;stroke-linejoin:round}
  @keyframes j60-repository-roles-en-move{to{stroke-dashoffset:-22}}
  @media (prefers-reduced-motion:reduce){.j60-repository-roles-en-flow{animation:none}}
</style>
<defs>
  <filter id="j60-repository-roles-en-sh" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="var(--sh)" flood-opacity="var(--sh-op)"/>
  </filter>
  <filter id="j60-repository-roles-en-shl" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="var(--sh)" flood-opacity="var(--shl-op)"/>
  </filter>
  <filter id="j60-repository-roles-en-shs" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="var(--sh)" flood-opacity="var(--shs-op)"/>
  </filter>
  <filter id="j60-repository-roles-en-gl" x="-60%" y="-90%" width="220%" height="280%">
    <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="var(--accent)" flood-opacity="var(--glow-op)"/>
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="var(--sh)" flood-opacity="var(--glow-cast)"/>
  </filter>
  <linearGradient id="j60-repository-roles-en-s" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/>
  </linearGradient>
  <linearGradient id="j60-repository-roles-en-sl" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/>
  </linearGradient>
  <marker id="j60-repository-roles-en-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
  </marker>
  <marker id="j60-repository-roles-en-tq" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/>
  </marker>
</defs>
<rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>
<text x="32" y="38" font-size="20" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="600" fill="var(--text)">Repository map</text>
<text x="32" y="64" font-size="13.5" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--dim)">Directory ownership within one monorepo</text>
<rect id="j60-repository-roles-en-repo" data-kind="region" x="32" y="104" width="896" height="344" rx="12" fill="url(#j60-repository-roles-en-sl)" stroke="var(--line-lead)" filter="url(#j60-repository-roles-en-shl)"/>
<text x="56" y="136" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" fill="var(--text)" data-box="j60-repository-roles-en-repo">k3s-managed-seonology-journey/</text>
<rect id="j60-repository-roles-en-apps" data-kind="card" x="56" y="160" width="416" height="256" rx="12" fill="url(#j60-repository-roles-en-s)" stroke="var(--line)" filter="url(#j60-repository-roles-en-sh)"/>
<path d="M68,161 H460" stroke="var(--hl)" fill="none"/>
<text x="80" y="192" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" fill="var(--text)" data-box="j60-repository-roles-en-apps">apps/</text>
<path d="M88,227 H104" fill="none" stroke="var(--quiet)" stroke-width="1"/>
<text x="112" y="232" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" fill="var(--body)" data-box="j60-repository-roles-en-apps">web/</text>
<text x="224" y="232" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--body)" data-box="j60-repository-roles-en-apps">React client</text>
<path d="M88,275 H104" fill="none" stroke="var(--quiet)" stroke-width="1"/>
<text x="112" y="280" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" fill="var(--body)" data-box="j60-repository-roles-en-apps">api/</text>
<text x="224" y="280" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--body)" data-box="j60-repository-roles-en-apps">REST / WebSocket</text>
<path d="M88,323 H104" fill="none" stroke="var(--quiet)" stroke-width="1"/>
<text x="112" y="328" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" fill="var(--body)" data-box="j60-repository-roles-en-apps">back/</text>
<text x="224" y="328" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--body)" data-box="j60-repository-roles-en-apps">gRPC / DynamoDB</text>
<path d="M88,371 H104" fill="none" stroke="var(--quiet)" stroke-width="1"/>
<text x="112" y="376" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" fill="var(--body)" data-box="j60-repository-roles-en-apps">android/</text>
<text x="224" y="376" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--body)" data-box="j60-repository-roles-en-apps">Android client</text>
<path d="M88,216 V371" fill="none" stroke="var(--quiet)" stroke-width="1"/>
<rect id="j60-repository-roles-en-proto" data-kind="card" x="504" y="160" width="400" height="104" rx="12" fill="url(#j60-repository-roles-en-s)" stroke="var(--line)" filter="url(#j60-repository-roles-en-sh)"/>
<path d="M516,161 H892" stroke="var(--hl)" fill="none"/>
<text x="528" y="192" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" fill="var(--text)" data-box="j60-repository-roles-en-proto">proto/</text>
<text x="528" y="224" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--body)" data-box="j60-repository-roles-en-proto">Shared contracts</text>
<text x="528" y="240" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--body)" data-box="j60-repository-roles-en-proto">Protobuf → Go / TypeScript</text>
<rect id="j60-repository-roles-en-deploy" data-kind="card" x="504" y="288" width="400" height="128" rx="12" fill="url(#j60-repository-roles-en-s)" stroke="var(--line)" filter="url(#j60-repository-roles-en-sh)"/>
<path d="M516,289 H892" stroke="var(--hl)" fill="none"/>
<text x="528" y="320" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" fill="var(--text)" data-box="j60-repository-roles-en-deploy">deploy/</text>
<text x="528" y="352" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--body)" data-box="j60-repository-roles-en-deploy">Standalone manifests</text>
<text x="528" y="384" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" fill="var(--body)" data-box="j60-repository-roles-en-deploy">Kustomize</text>
<text x="32" y="480" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--body)">Cluster source: seonology-k3s / workloads/seonology-journey</text>
<text x="32" y="516" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--faint)">Gitea is the source of truth; its push mirror copies branches and tags to GitHub.</text>
</svg>
