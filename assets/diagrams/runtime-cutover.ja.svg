<rect id="j60-runtime-cutover-ja-argo" data-kind="card" x="576" y="104" width="176" height="88" rx="12" fill="url(#j60-runtime-cutover-ja-s)" stroke="var(--line)" filter="url(#j60-runtime-cutover-ja-sh)"/>
<path d="M588,105 H740" stroke="var(--hl)" fill="none"/>
