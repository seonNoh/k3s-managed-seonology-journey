<rect id="j60-runtime-cutover-ja-upd-act" data-kind="block" x="288" y="224" width="16" height="112" rx="8" fill="var(--inner)" stroke="var(--line)" filter="url(#j60-runtime-cutover-ja-sh)"/>
<rect id="j60-runtime-cutover-ja-git-act" data-kind="block" x="472" y="296" width="16" height="104" rx="8" fill="var(--inner)" stroke="var(--line)" filter="url(#j60-runtime-cutover-ja-sh)"/>
