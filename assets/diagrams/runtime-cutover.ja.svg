<rect id="j60-runtime-cutover-ja-updater" data-kind="card" x="208" y="104" width="176" height="88" rx="12" fill="url(#j60-runtime-cutover-ja-sl)" stroke="var(--line-lead)" filter="url(#j60-runtime-cutover-ja-shl)"/>
<path d="M220,105 H372" stroke="var(--hl)" fill="none"/>
<text x="228" y="148" font-size="15" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="500" fill="var(--text)" data-box="j60-runtime-cutover-ja-updater">Image Updater</text>
<rect id="j60-runtime-cutover-ja-git" data-kind="card" x="392" y="104" width="176" height="88" rx="12" fill="url(#j60-runtime-cutover-ja-s)" stroke="var(--line)" filter="url(#j60-runtime-cutover-ja-sh)"/>
<path d="M404,105 H556" stroke="var(--hl)" fill="none"/>
