<rect id="j60-runtime-cutover-ja-namespace" data-kind="card" x="760" y="104" width="176" height="88" rx="12" fill="url(#j60-runtime-cutover-ja-s)" stroke="var(--line)" filter="url(#j60-runtime-cutover-ja-sh)"/>
<path d="M772,105 H924" stroke="var(--hl)" fill="none"/>
