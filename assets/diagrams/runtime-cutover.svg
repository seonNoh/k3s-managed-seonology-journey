<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" lang="en" role="img" aria-labelledby="j60-runtime-cutover-en-title j60-runtime-cutover-en-desc">
<title id="j60-runtime-cutover-en-title">GitOps delivery</title>
<desc id="j60-runtime-cutover-en-desc">Digest tracking → Git write-back → automated sync</desc>
<style>
  svg{
    --bg:#0d1117; --surface-a:#1b222c; --surface-b:#151b23;
    --lead-a:#222b38; --lead-b:#19202a;
    --inner:#1e2530; --inner-lead:#232c39;
    --line:#252d38; --line-lead:#33404f;
    --text:#f0f6fc; --body:#c3ccd6; --dim:#a2abb5; --faint:#8d959f;
    --accent:#7c9fff; --accent-bg:rgba(124,159,255,.16);
    --ok:#4ac97e; --warn:#e0a740; --bad:#f2705e; --off:#8b939d;
    --quiet:#78818c;
    --sh:#000; --sh-op:.50; --shl-op:.58; --shs-op:.40;
    --glow-op:.40; --glow-cast:.45; --hl:rgba(255,255,255,.05);
  }
  @media (prefers-color-scheme: light){
    svg{
      --bg:#f6f8fa; --surface-a:#ffffff; --surface-b:#fafbfc;
      --lead-a:#ffffff; --lead-b:#f5f8ff;
      --inner:#eef1f4; --inner-lead:#e9f0fe;
      --line:#d8dee4; --line-lead:#b8c9ee;
      --text:#1f2328; --body:#3d444d; --dim:#59636e; --faint:#656d7a;
      --accent:#2f62d4; --accent-bg:rgba(47,98,212,.10);
      --ok:#187734; --warn:#8e5f00; --bad:#cf222e; --off:#5f6773;
      --quiet:#6e7781;
      --sh:#1f2328; --sh-op:.13; --shl-op:.18; --shs-op:.12;
      --glow-op:.35; --glow-cast:.14; --hl:transparent;
    }
  }
  .j60-runtime-cutover-en-flow{fill:none;stroke:var(--accent);stroke-width:1.6;
          stroke-linecap:round;stroke-linejoin:round;
          stroke-dasharray:5 6;animation:j60-runtime-cutover-en-move 2s linear infinite}
  .j60-runtime-cutover-en-quiet{fill:none;stroke:var(--quiet);stroke-width:1.4;
           stroke-linecap:round;stroke-linejoin:round}
  @keyframes j60-runtime-cutover-en-move{to{stroke-dashoffset:-22}}
  @media (prefers-reduced-motion:reduce){.j60-runtime-cutover-en-flow{animation:none}}
</style>
<defs>
  <filter id="j60-runtime-cutover-en-sh" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-3" dy="10" stdDeviation="9" flood-color="var(--sh)" flood-opacity="var(--sh-op)"/>
  </filter>
  <filter id="j60-runtime-cutover-en-shl" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="-4" dy="13" stdDeviation="11" flood-color="var(--sh)" flood-opacity="var(--shl-op)"/>
  </filter>
  <filter id="j60-runtime-cutover-en-shs" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="var(--sh)" flood-opacity="var(--shs-op)"/>
  </filter>
  <filter id="j60-runtime-cutover-en-gl" x="-60%" y="-90%" width="220%" height="280%">
    <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="var(--accent)" flood-opacity="var(--glow-op)"/>
    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="var(--sh)" flood-opacity="var(--glow-cast)"/>
  </filter>
  <linearGradient id="j60-runtime-cutover-en-s" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--surface-a)"/><stop offset="1" stop-color="var(--surface-b)"/>
  </linearGradient>
  <linearGradient id="j60-runtime-cutover-en-sl" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="var(--lead-a)"/><stop offset="1" stop-color="var(--lead-b)"/>
  </linearGradient>
  <marker id="j60-runtime-cutover-en-t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/>
  </marker>
  <marker id="j60-runtime-cutover-en-tq" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="var(--quiet)"/>
  </marker>
</defs>
<rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>
<text x="32" y="38" font-size="20" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="600" fill="var(--text)">GitOps delivery</text>
<text x="32" y="64" font-size="13.5" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--dim)">Digest tracking → Git write-back → automated sync</text>
<rect id="j60-runtime-cutover-en-registry" data-kind="card" x="32" y="112" width="176" height="64" rx="12" fill="url(#j60-runtime-cutover-en-s)" stroke="var(--line)" filter="url(#j60-runtime-cutover-en-sh)"/>
<path d="M44,113 H196" stroke="var(--hl)" fill="none"/>
<text x="52" y="148" font-size="15" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="500" fill="var(--text)" data-box="j60-runtime-cutover-en-registry">Gitea Registry</text>
<rect id="j60-runtime-cutover-en-updater" data-kind="card" x="256" y="112" width="192" height="64" rx="12" fill="url(#j60-runtime-cutover-en-sl)" stroke="var(--line-lead)" filter="url(#j60-runtime-cutover-en-shl)"/>
<path d="M268,113 H436" stroke="var(--hl)" fill="none"/>
<text x="276" y="148" font-size="15" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="500" fill="var(--text)" data-box="j60-runtime-cutover-en-updater">Image Updater</text>
<rect id="j60-runtime-cutover-en-git" data-kind="card" x="496" y="112" width="192" height="64" rx="12" fill="url(#j60-runtime-cutover-en-s)" stroke="var(--line)" filter="url(#j60-runtime-cutover-en-sh)"/>
<path d="M508,113 H676" stroke="var(--hl)" fill="none"/>
<text x="516" y="148" font-size="15" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="500" fill="var(--text)" data-box="j60-runtime-cutover-en-git">seonology-k3s</text>
<rect id="j60-runtime-cutover-en-argo" data-kind="card" x="736" y="112" width="192" height="64" rx="12" fill="url(#j60-runtime-cutover-en-s)" stroke="var(--line)" filter="url(#j60-runtime-cutover-en-sh)"/>
<path d="M748,113 H916" stroke="var(--hl)" fill="none"/>
<text x="756" y="148" font-size="15" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="500" fill="var(--text)" data-box="j60-runtime-cutover-en-argo">Argo CD</text>
<path d="M120,176 V464" fill="none" stroke="var(--quiet)" stroke-width="1" stroke-dasharray="2 6"/>
<path d="M352,176 V464" fill="none" stroke="var(--quiet)" stroke-width="1" stroke-dasharray="2 6"/>
<path d="M592,176 V464" fill="none" stroke="var(--quiet)" stroke-width="1" stroke-dasharray="2 6"/>
<path d="M832,176 V464" fill="none" stroke="var(--quiet)" stroke-width="1" stroke-dasharray="2 6"/>
<rect id="j60-runtime-cutover-en-reg-act" data-kind="block" x="112" y="208" width="16" height="32" rx="8" fill="var(--inner)" stroke="var(--line)" filter="url(#j60-runtime-cutover-en-sh)"/>
<rect id="j60-runtime-cutover-en-upd-act" data-kind="block" x="344" y="208" width="16" height="136" rx="8" fill="var(--inner)" stroke="var(--line)" filter="url(#j60-runtime-cutover-en-sh)"/>
<rect id="j60-runtime-cutover-en-git-act" data-kind="block" x="584" y="304" width="16" height="128" rx="8" fill="var(--inner)" stroke="var(--line)" filter="url(#j60-runtime-cutover-en-sh)"/>
<rect id="j60-runtime-cutover-en-argo-act" data-kind="block" x="824" y="400" width="16" height="48" rx="8" fill="var(--inner)" stroke="var(--line)" filter="url(#j60-runtime-cutover-en-sh)"/>
<path data-from="j60-runtime-cutover-en-upd-act" data-to="j60-runtime-cutover-en-reg-act" data-pts="344,224;128,224" d="M344,224 L128,224" class="j60-runtime-cutover-en-quiet" marker-end="url(#j60-runtime-cutover-en-tq)"/>
<path data-from="j60-runtime-cutover-en-upd-act" data-to="j60-runtime-cutover-en-git-act" data-pts="360,320;584,320" d="M360,320 L584,320" class="j60-runtime-cutover-en-flow" marker-end="url(#j60-runtime-cutover-en-t)"/>
<path data-from="j60-runtime-cutover-en-argo-act" data-to="j60-runtime-cutover-en-git-act" data-pts="824,416;600,416" d="M824,416 L600,416" class="j60-runtime-cutover-en-quiet" marker-end="url(#j60-runtime-cutover-en-tq)"/>
<text x="144" y="200" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--dim)">Read latest digest</text>
<text x="376" y="296" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--dim)">Write kustomization</text>
<text x="616" y="392" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--dim)">Read production overlay</text>
<text x="32" y="488" font-size="13" font-family="Pretendard, system-ui, -apple-system, sans-serif" font-weight="400" fill="var(--body)">Target: seonology-journey · web / API / back: 2 replicas each</text>
<text x="32" y="516" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="400" fill="var(--faint)">workloads/seonology-journey/overlays/production</text>
</svg>
